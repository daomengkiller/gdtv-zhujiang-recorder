plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.cjw.gdtvrec'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.cjw.gdtvrec'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
