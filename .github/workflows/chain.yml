name: record-chain

# 兜底触发器：GitHub 的 schedule 对本仓库不生效（2026-11-06 实测 event=schedule 为 0），
# 这里用“自维持链”保证每天 21:00 一定会有人在场录制：
#   每一棒启动时先派发下一棒（排队等本棒结束），本棒守到 20:45 就跑 record.sh，
#   跑完睡到本棒到期（5h20m）→ 下一棒接手。链一旦踢起来就 24h 连续覆盖。
#
# 关闭方法：把下面「预派发下一棒」这一步删掉/注释，链会在当前这一棒结束后自然停止。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-chain        # 同一时刻只允许一棒，下一棒排队
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  MAX_RUNTIME: '19200'       # 每棒 5h20m
  ARM_HHMM: '20:45'
  START_HHMM: '21:00'
  END_HHMM: '22:00'
  WAIT_MAX_MIN: '70'
  TRANSCODE: '720p'
  KEEP_BYTES: '8000000000'
  KEEP_COUNT: '30'
  KEEP_MIN: '3'
  KEEP_DAYS: '0'

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 预派发下一棒（先排队，本棒失败也不断链）
        env:
          PAT: ${{ secrets.CHAIN_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "$PAT" ]; then
            echo "::error:: 仓库 secret CHAIN_PAT 未设置，链无法自我维持"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/chain.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "第 $i 次派发 → HTTP $code"
            [ "$code" = "204" ] && break
            cat /tmp/d.json 2>/dev/null || true
            sleep 8
          done
          [ "$code" = "204" ] || { echo "::error:: 派发下一棒失败"; exit 1; }

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: 守护并录制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/daemon.sh

      - name: 上传到 Release（本棒录到的话）
        if: env.OUT_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(printf '频道: 广东珠江 https://www.gdtv.cn/tvChannelDetail/44\n录制时段: %s-%s (Asia/Shanghai)\n文件: %s\n大小: %s MiB\n触发: record-chain / %s' \
            "$START_HHMM" "$END_HHMM" "$OUT_NAME" "$((OUT_BYTES/1024/1024))" "$(git rev-parse --short HEAD)")
          gh release create "$OUT_TAG" "$OUT_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "广东珠江 ${OUT_TAG#rec-}" \
            --notes "$NOTES" \
            --latest

      - name: 按配额清理最旧录制
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/prune.py \
            --repo "$GITHUB_REPOSITORY" \
            --keep-bytes "$KEEP_BYTES" \
            --keep-count "$KEEP_COUNT" \
            --keep-min "$KEEP_MIN" \
            --keep-days "$KEEP_DAYS"

      - name: 保活心跳
        if: env.OUT_FILE != ''
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '{\n  "last_run": "%s",\n  "last_release": "%s",\n  "file": "%s",\n  "bytes": %s,\n  "by": "record-chain"\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$OUT_TAG" "$OUT_NAME" "$OUT_BYTES" > docs/heartbeat.json
          git config user.name "gdtv-recorder-bot"
          git config user.email "gdtv-recorder-bot@users.noreply.github.com"
          git add docs/heartbeat.json
          git commit -m "chore: heartbeat ${OUT_TAG}" || exit 0
          git push
