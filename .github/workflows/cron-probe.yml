name: cron-probe

# 临时探针：验证本仓库的 schedule 触发器是否真的会按时触发（每 5 分钟一次）。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 打印时间
        run: |
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CST now: $(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)"
          echo "event: $GITHUB_EVENT_NAME"