name: record-gdtv-zhujiang

# 广东珠江（https://www.gdtv.cn/tvChannelDetail/44）
# 每天中国时区 21:00-22:00 录制，成片上传 Release，并按配额自动删最旧。
#
# ── 为什么长这样 ────────────────────────────────────────────────
# 这个环境里的 GitHub 调度器不是按时派发 cron，而是按固定扫描窗口批量派发：
# 实测（同账号老仓库 200 条 schedule 记录）派发时刻总落在 UTC 01:30-03:45、
# 13:30-15:00、21:50-24:00 三簇 = CST 09:30-11:45、21:30-23:00、05:50-08:00。
# 也就是说 cron 写几点都会被"吸"到窗口上，永远落不进 16:20-21:00 这段。
#
# 所以不跟调度器较劲：**只要今天有一次派发**，run 内部就用 4 个串行 job
# （每个 job 上限 6 小时）接力 sleep，把这次 run 拖到 21:00，再开录。
# 不需要 PAT、不需要自己派发自己。
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时一次，保证「今天至少被派发一次」
  workflow_dispatch:
    inputs:
      start:
        description: '开始时间 HH:MM (Asia/Shanghai)'
        required: false
        default: '21:00'
      end:
        description: '结束时间 HH:MM (Asia/Shanghai)'
        required: false
        default: '22:00'
      duration:
        description: '覆盖时长(秒)，>0 时立即录制这么久，忽略等待与时间窗（测试用，如 30）'
        required: false
        default: '0'
      stream_urls:
        description: '临时指定直播源(逗号分隔，留空用 scripts/streams.txt)'
        required: false
        default: ''
      transcode:
        description: '转码档位: 720p(默认) / 480p / off(直接复制，最大画质但体积大)'
        required: false
        default: '720p'

permissions:
  contents: write

concurrency:
  group: record-gdtv-zhujiang
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  START_HHMM: ${{ github.event.inputs.start || '21:00' }}
  END_HHMM: ${{ github.event.inputs.end || '22:00' }}
  DURATION: ${{ github.event.inputs.duration || '0' }}
  HOLD_MIN: '340'            # 每个等待 job 最多睡 340 分钟（job 上限 6h）
  WAIT_MAX_MIN: '280'        # 录前脚本自己还能再等 4h40m
  STREAM_URLS: ${{ github.event.inputs.stream_urls }}
  TRANSCODE: ${{ github.event.inputs.transcode || '720p' }}
  # ---- 存储配额：超出后从最旧的录制开始删 ----
  KEEP_BYTES: '8000000000'   # 约 8 GiB
  KEEP_COUNT: '30'           # 最多 30 期
  KEEP_MIN: '3'              # 至少保留 3 期
  KEEP_DAYS: '0'             # >0 时同时限制保留天数

jobs:
  # ── 等待链：4 棒 × 340min ≈ 22.7h，足够覆盖任何派发时刻 ──
  hold1:
    name: 等待 1/4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hold.sh

  hold2:
    name: 等待 2/4
    needs: hold1
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hold.sh

  hold3:
    name: 等待 3/4
    needs: hold2
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hold.sh

  hold4:
    name: 等待 4/4
    needs: hold3
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/hold.sh

  record:
    name: 录制 广东珠江
    needs: hold4
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 准备 ffmpeg
        timeout-minutes: 10
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "runner 自带 ffmpeg: $(ffmpeg -version | head -1)"
            exit 0
          fi
          echo "未自带，安装中…"
          sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 ffmpeg
          ffmpeg -version | head -1

      - name: 录制
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/record.sh

      - name: 上传到 Release
        if: env.OUT_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "上传 $OUT_NAME ($((OUT_BYTES/1024/1024)) MiB) → $OUT_TAG"
          NOTES=$(printf '频道: 广东珠江 https://www.gdtv.cn/tvChannelDetail/44\n录制时段: %s-%s (Asia/Shanghai)\n文件: %s\n大小: %s MiB\n触发: %s / %s' \
            "$START_HHMM" "$END_HHMM" "$OUT_NAME" "$((OUT_BYTES/1024/1024))" "$GITHUB_EVENT_NAME" "$(git rev-parse --short HEAD)")
          gh release create "$OUT_TAG" "$OUT_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "广东珠江 ${OUT_TAG#rec-}" \
            --notes "$NOTES" \
            --latest

      - name: 按配额清理最旧录制
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/prune.py \
            --repo "$GITHUB_REPOSITORY" \
            --keep-bytes "$KEEP_BYTES" \
            --keep-count "$KEEP_COUNT" \
            --keep-min "$KEEP_MIN" \
            --keep-days "$KEEP_DAYS"

      - name: 保活心跳（GitHub 60 天无活动会停用定时任务）
        if: env.OUT_FILE != ''
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '{\n  "last_run": "%s",\n  "last_release": "%s",\n  "file": "%s",\n  "bytes": %s\n}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$OUT_TAG" "$OUT_NAME" "$OUT_BYTES" > docs/heartbeat.json
          cat docs/heartbeat.json
          git config user.name "gdtv-recorder-bot"
          git config user.email "gdtv-recorder-bot@users.noreply.github.com"
          git add docs/heartbeat.json
          git commit -m "chore: heartbeat ${OUT_TAG}" || exit 0
          git push

      - name: 摘要
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### 广东珠江录制"
            echo ""
            echo "- 产物: \`${OUT_NAME:-无}\` ${OUT_BYTES:+, $((OUT_BYTES/1024/1024)) MiB}"
            echo "- Release: \`${OUT_TAG:-无}\`"
            echo "- 当前 Release 用量:"
            echo '```'
            gh release list --repo "$GITHUB_REPOSITORY" --limit 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
